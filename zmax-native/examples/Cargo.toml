# Example native zmax plugins. Kept as its own workspace (separate from the zmax
# root workspace) so cargo treats each crate as an ordinary downstream consumer
# of the `zmax-native` SDK — exactly how a third-party plugin author's crate
# would look — while still sharing one `target/` dir so `cargo build` here builds
# every example at once.
[workspace]
resolver = "2"
members = [
  "hello-plugin",
  "insert-date",
  "buffer-stats",
  "trim-trailing",
  "banner",
  "zwire-lookup",
  "scope-at-cursor",
  "swap-doctor",
  "three-lists",
  "block-peek",
  "nav-history",
  "window-map",
  "width-check",
  "opt-info",
  "file-facts",
  "fold-outline",
  "search-peek",
  "three-coords",
  "todo-scan",
  "registers",
  "project-check",
  "writing-stats",
  "screen-where",
  "undo-branches",
  "cross-buffer",
  "complete-peek",
]

[workspace.dependencies]
zmax-native = { path = ".." }
