name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v25.7.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Never clone tree-sitter grammars in CI. `zmax-term/build.rs` otherwise
  # git-clones every grammar in languages.toml from its own upstream forge, with
  # STRICT = true, so a single forge being unreachable aborts the whole release:
  # v0.4.44 lost all three shippable targets to `fatal: unable to access
  # 'https://codeberg.org/...': The requested URL returned error: 503`. Grammars
  # are fetched/compiled on the user's machine with `zmax -g fetch` / `-g build`.
  # build.yml already sets this; release.yml did not.
  ZMAX_DISABLE_AUTO_GRAMMAR_BUILD: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Per-target failures are tolerated (continue-on-error) so the release + tap
    # ship from whichever targets built; the formula's emit() skips missing ones.
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS runners (macos-13) are scarce/deprecated and queue
          # indefinitely, so cross-compile x86_64 on the arm runner. clang's
          # universal SDK + cc -arch x86_64 handles the grammars. allow_failure
          # keeps a cross hiccup from blocking the whole release.
          - os: macos-latest
            target: x86_64-apple-darwin
            allow_failure: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          # One level only — NOT recursive. vendor/arblang nests a private
          # lib/zgui-core submodule that GITHUB_TOKEN can't clone; recursing
          # dies with "repository not found" and blocks the whole release.
          # arblang's build.rs degrades gracefully when zgui-core is absent.
          submodules: true

      # The rust-toolchain action ignores rust-toolchain.toml; remove it so the
      # toolchain used to build matches the one the action installs.
      - name: Remove rust-toolchain.toml
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # GMP (awkrs → rug → gmp-mpfr-sys) builds through its own ./configure, which
      # picks the runner's native arm64 clang and then hands it x86_64 assembly:
      # "unrecognized instruction mnemonic" on every x86_64_*.s, and the release's
      # Intel binary never gets built (v0.4.51). Point the C compiler at the
      # x86_64 slice of the universal SDK. Rust-side C builds go through cc-rs,
      # which already passes -arch itself, so the repeated flag changes nothing
      # there. The crate's own cross guard is lifted by the `force-cross` feature
      # zmax-term names in its manifest.
      - name: Cross-compile setup (x86_64 macOS on the arm64 runner)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CFLAGS=-arch x86_64" >> "$GITHUB_ENV"

      # No actions/setup-python step on purpose: zmax depends on pythonrs with
      # `default-features = false`, so nothing in the build links pyo3/libpython.
      # v0.4.43 did pin an interpreter here, and pyo3 baked the runner's absolute
      # framework path (/Library/Frameworks/Python.framework/Versions/3.13/{Python,
      # lib/libncurses.6.dylib} on macOS, /opt/hostedtoolcache/... on Linux) into
      # every released binary — which aborted at startup on every user machine.
      # Never reintroduce an interpreter dependency in the release build.

      # Two binaries per target: the full default build (all embedded scripting
      # languages) and a "minimal" build with the `scripting` feature off, which
      # drops every interpreter crate (elisprs/vimlrs/awkrs/zshrs/strykelang) for
      # a smaller binary. Each cargo build writes the same target/.../zmax path,
      # so stash each before the next.
      #
      # build.rs fetches + compiles the tree-sitter grammars for ${target} into
      # runtime/grammars during the build (Cargo.lock is gitignored, no --locked).
      - name: Build zmax (full)
        run: |
          cargo build --locked --release --bin zmax --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/zmax" zmax-full

      - name: Build zmax (minimal — no embedded scripting)
        run: |
          cargo build --locked --release --bin zmax \
            --no-default-features --features git --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/zmax" zmax-minimal

      - name: Package (binaries + runtime)
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          target="${{ matrix.target }}"
          # Bundle the runtime tree (queries/themes/tutor) once and share it
          # between both variants. No grammars are built here — see
          # ZMAX_DISABLE_AUTO_GRAMMAR_BUILD above — so runtime/grammars is
          # absent; the rm stays as a guard for a dirty local checkout.
          rm -rf runtime/grammars
          package() {
            local suffix="$1" binary="$2"
            local pkg="zmax-${TAG}-${target}${suffix}"
            mkdir -p "$pkg"
            cp "$binary" "$pkg/zmax"
            strip "$pkg/zmax" 2>/dev/null || true
            cp -r runtime "$pkg/runtime"
            cp LICENSE README.md ATTRIBUTION.md "$pkg/" 2>/dev/null || true
            tar czf "${pkg}.tar.gz" "$pkg"
          }
          # Full keeps the canonical name (Homebrew + install.sh consume it);
          # minimal gets a `-minimal` suffix.
          package ""         zmax-full
          package "-minimal" zmax-minimal

      - uses: actions/upload-artifact@v4
        with:
          name: zmax-${{ matrix.target }}
          path: zmax-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.tar.gz

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        shell: bash
        run: |
          for f in artifacts/*.tar.gz; do
            base=$(basename "$f")
            sum=$(sha256sum "$f" | awk '{print $1}')
            # zmax-vX.Y.Z-<target>.tar.gz -> <target with _ for ->
            key=$(echo "$base" | sed 's/zmax-v[^-]*-//; s/\.tar\.gz//; s/-/_/g')
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v6
        with:
          repository: MenkeTechnologies/homebrew-menketech
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update zmax formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA_ARM_MACOS: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          SHA_X86_MACOS: ${{ steps.sha.outputs.x86_64_apple_darwin }}
          SHA_X86_LINUX: ${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}
          SHA_ARM_LINUX: ${{ steps.sha.outputs.aarch64_unknown_linux_gnu }}
        run: |
          set -eu
          V="${VERSION#v}"
          BASE="https://github.com/MenkeTechnologies/zmax/releases/download/v${V}"
          # Emit an on_arm / on_intel block only when its SHA is non-empty
          # (so the formula stays valid even if a target failed to build).
          emit() {
            local guard="$1" arch="$2" sha="$3"
            [ -n "$sha" ] || return 0
            printf '    %s do\n      url "%s/zmax-v%s-%s.tar.gz"\n      sha256 "%s"\n    end\n' \
              "$guard" "$BASE" "$V" "$arch" "$sha"
          }
          mac_blocks=$( { emit on_arm aarch64-apple-darwin "$SHA_ARM_MACOS"; emit on_intel x86_64-apple-darwin "$SHA_X86_MACOS"; } )
          linux_blocks=$( { emit on_intel x86_64-unknown-linux-gnu "$SHA_X86_LINUX"; emit on_arm aarch64-unknown-linux-gnu "$SHA_ARM_LINUX"; } )
          {
            printf 'class Zmax < Formula\n'
            printf '  desc "Modal text editor in Rust — vim/emacs keymaps"\n'
            printf '  homepage "https://github.com/MenkeTechnologies/zmax"\n'
            printf '  license "MPL-2.0"\n'
            printf '  version "%s"\n\n' "$V"
            [ -n "$mac_blocks" ]   && printf '  on_macos do\n%s\n  end\n\n' "$mac_blocks"
            [ -n "$linux_blocks" ] && printf '  on_linux do\n%s\n  end\n\n' "$linux_blocks"
            # Install the binary + runtime under libexec; symlink the binary
            # into bin. zmax finds runtime/ as a sibling of the real binary.
            printf '  def install\n'
            printf '    libexec.install Dir["*"]\n'
            printf '    bin.install_symlink libexec/"zmax"\n'
            printf '  end\n\n'
            printf '  test do\n'
            printf '    assert_match "zmax", shell_output("#{bin}/zmax --version")\n'
            printf '  end\n'
            printf 'end\n'
          } > tap/Formula/zmax.rb

      - name: Push formula update
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zmax.rb
          if git diff --cached --quiet; then
            echo "no changes — formula already up to date"
            exit 0
          fi
          git commit -m "zmax: bump to ${{ github.ref_name }}"
          # The tap is shared by ~30 repos. When several releases land together
          # a bare push loses a non-fast-forward race, so rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "tap push rejected (concurrent update) — rebasing, attempt $attempt/5"
            git pull --rebase --autostash origin main || exit 1
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "tap push failed after 5 attempts" >&2
          exit 1
