[package]
name = "zmax-loader"
description = "Build bootstrapping for Zmax crates"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "zmax-loader"
path = "src/main.rs"

[dependencies]
zmax-stdx = { path = "../zmax-stdx" }

anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml.workspace = true
etcetera.workspace = true
once_cell = "1.21"
parking_lot.workspace = true
sha2 = "0.10"
globset.workspace = true
log = "0.4"

# TODO: these two should be on !wasm32 only

# cloning/compiling tree-sitter grammars
cc = { version = "1" }
# `tree-sitter generate` as a library, for grammars that ship only grammar.json.
# Its ABI_VERSION_MAX (15) must stay within tree-house's supported ABI range.
# `default-features = false` drops the crate's QuickJS runtime (and with it
# rquickjs/bindgen/libclang): grammars are generated from their dumped
# `grammar.json`, never by evaluating `grammar.js`.
tree-sitter-generate = { version = "0.26", default-features = false }
threadpool = { version = "1.0" }
tempfile.workspace = true

tree-house.workspace = true
